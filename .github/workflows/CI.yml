name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Update Rust
        run: rustup update

      - name: Run root tests
        run: cargo test

      - name: Run build debug
        working-directory: ${{github.workspace}}/test-crate
        run: cargo build

      - name: Run build release
        working-directory: ${{github.workspace}}/test-crate
        run: cargo build --release

      - name: Run test crate debug
        working-directory: ${{github.workspace}}/test-crate
        run: cargo test

      - name: Run test crate release
        working-directory: ${{github.workspace}}/test-crate
        run: cargo test --release

  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
          - arm-unknown-linux-gnueabihf
          - arm-unknown-linux-musleabihf
          - i686-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - riscv64gc-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild

      - name: Install Rust target
        run: |
          rustup update
          rustup target add ${{ matrix.target }}

      - name: Cross-compile test-crate
        working-directory: ${{github.workspace}}/test-crate
        run: cargo zigbuild --target ${{ matrix.target }}

      - name: Cross-compile test-crate (release)
        working-directory: ${{github.workspace}}/test-crate
        run: cargo zigbuild --target ${{ matrix.target }} --release

  target-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-apple-darwin
          - aarch64-apple-ios-sim
          - aarch64-linux-android
          - x86_64-pc-windows-msvc
          - wasm32-unknown-unknown

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install Rust target
        run: |
          rustup update
          rustup target add ${{ matrix.target }}

      - name: Check target smoke package
        run: cargo check --manifest-path test-targets/Cargo.toml --target ${{ matrix.target }}

  wasm-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust wasm target
        run: |
          rustup update
          rustup target add wasm32-unknown-unknown

      - name: Build wasm integration crate
        working-directory: ${{github.workspace}}/test-wasm
        run: cargo build --target wasm32-unknown-unknown

      - name: Run wasm integration crate
        working-directory: ${{github.workspace}}/test-wasm
        run: node run.js
